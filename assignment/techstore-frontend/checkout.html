<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore - Checkout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Common Header & Navbar -->
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">⚡ TechStore</a>
      <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart <span class="cart-badge">0</span></a>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div class="checkout-container">
      <h1 class="section-title">Shipping & Payment Details</h1>
      
      <!-- Checkout Form (Validated via JavaScript in script.js - Tasks 6 & 7) -->
      <form action="#" method="POST" class="checkout-form" novalidate>
        
        <!-- Full Name -->
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" class="form-control" placeholder="John Doe">
        </div>

        <!-- Address -->
        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" class="form-control" placeholder="123 Tech Street, Suite 400">
        </div>

        <!-- City -->
        <div class="form-group">
          <label for="city">City</label>
          <input type="text" id="city" name="city" class="form-control" placeholder="Roorkee">
        </div>

        <!-- Pincode -->
        <div class="form-group">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" name="pincode" class="form-control" placeholder="247667">
        </div>

        <!-- Phone -->
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" class="form-control" placeholder="9876543210">
        </div>

        <!-- Payment Method (Radio Buttons) -->
        <div class="form-group">
          <label>Payment Method</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="payment" value="credit_card" checked>
              Credit / Debit Card
            </label>
            <label class="radio-option">
              <input type="radio" name="payment" value="upi">
              UPI / Netbanking
            </label>
            <label class="radio-option">
              <input type="radio" name="payment" value="cod">
              Cash on Delivery (COD)
            </label>
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary btn-submit">Place Order</button>

      </form>
    </div>
  </main>

  <!-- Common Footer -->
  <footer>
    <div class="footer-container">
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="cart.html">Cart</a>
        <a href="checkout.html">Checkout</a>
      </div>
      <p>Contact Us: support@techstore.com | Phone: +1 (800) 555-TECH</p>
      <p>&copy; 2026 TechStore Inc. All rights reserved. Department of CSE, COER University.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
